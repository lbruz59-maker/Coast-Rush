name: Build Coast Rush APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CoastRush-Android-Project-Structured.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q CoastRush-Android-Project-Structured.zip -d extracted
          cp -R extracted/CoastRush-Android-Project/. .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coast-Rush-Android-APK
          path: app/build/outputs/apk/debug/*.apk
