name: Build Coast Rush APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'app/**' # Fire TV project
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Coast Rush APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coast-Rush-FireTV-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
