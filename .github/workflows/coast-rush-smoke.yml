name: Coast Rush V235 browser smoke test

on:
  workflow_run:
    workflows: ["Deploy Coast Rush to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test deployed V235 in Chromium
        run: node .github/scripts/coast-rush-v235-smoke.mjs
